<style>
  @import url('https://fonts.googleapis.com/css2?family=Parisienne&family=Fondamento:ital@0;1&family=Della+Respira&family=Cinzel:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5efe0;
    color: #2a1f0e;
    font-family: 'Della Respira', Georgia, serif;
  }

  .header {
    text-align: center;
    padding: 50px 20px 30px;
    max-width: 860px;
    margin: 0 auto;
  }

  .chapter-label {
    font-family: 'Cinzel', serif;
    font-size: 0.85em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #9a6a20;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Parisienne', cursive;
    font-size: 3em;
    color: #7a3a00;
    margin-bottom: 14px;
  }

  .intro {
    font-size: 1em;
    line-height: 1.8;
    color: #4a3a20;
    max-width: 620px;
    margin: 0 auto 10px;
    font-style: italic;
  }

  .divider {
    text-align: center;
    color: #9a6a20;
    font-size: 1.4em;
    margin: 20px 0 36px;
    letter-spacing: 0.4em;
  }

  /* Row-based grid — fills left to right */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .gallery-item {
    min-width: 0;
  }

  .gallery-item a {
    display: block;
  }

  .gallery-item img {
    width: 100%;
    display: block;
    border: 2px solid #c8a878;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    transition: opacity 0.2s, transform 0.2s;
  }

  .gallery-item img:hover {
    opacity: 0.9;
    transform: scale(1.01);
  }

  /* Full-width panoramic item */
  .gallery-item.wide {
    grid-column: 1 / -1;
  }

  .back-link {
    display: block;
    text-align: center;
    margin-bottom: 40px;
    font-family: 'Cinzel', serif;
    font-size: 0.9em;
    color: #7a3a00;
    text-decoration: none;
    letter-spacing: 0.1em;
  }
  .back-link:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 2em; }
  }
  @media (max-width: 600px) {
    .gallery { grid-template-columns: 1fr; }
    .gallery-item.full-width { grid-column: span 1; }
  }
</style>
</head>
